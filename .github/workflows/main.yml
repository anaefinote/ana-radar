# Builds ANA for iPhone / iPad on GitHub's Mac (no Mac needed) and attaches an unsigned ANA.ipa to the run.
# Sideloadly (on Windows) signs it with your Apple ID and installs it. See README_iOS.md.
name: Build ANA Orbit for iPhone

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15-intel   # the Apple-chip Macs were overbooked; Intel builds the same app
    steps:
      - uses: actions/checkout@v4

      - name: Lesson rule (ANA Rule v1) - all spec test files must pass first
        run: |
          swiftc -O ios/ANA/AnaRule.swift ios/tests/main.swift -o /tmp/anarule_vectors
          /tmp/anarule_vectors spec/vectors

      - name: Bills (BillCore) - Android's bill files must read the same on iPhone
        run: |
          swiftc -O ios/ANA/BillCore.swift ios/tests/bills/main.swift -o /tmp/bills_vectors
          /tmp/bills_vectors spec/bills_vectors

      - name: Put the sketch into the app
        run: bash ios/sync_web.sh

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project ANA.xcodeproj -target ANA -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Pack ANA.ipa
        run: |
          cd ios/build/Release-iphoneos
          mkdir -p Payload
          cp -R ANA.app Payload/
          zip -qry "$GITHUB_WORKSPACE/ANA.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ANA-Orbit-iPhone
          path: ANA.ipa

      - name: Build ANA STATIA (unsigned)
        run: |
          cd ios
          xcodebuild -project ANA.xcodeproj -target STATIA -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Pack STATIA.ipa
        run: |
          cd ios/build/Release-iphoneos
          rm -rf PayloadS && mkdir -p PayloadS/Payload
          cp -R STATIA.app PayloadS/Payload/
          cd PayloadS && zip -qry "$GITHUB_WORKSPACE/STATIA.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ANA-STATIA-iPhone
          path: STATIA.ipa
